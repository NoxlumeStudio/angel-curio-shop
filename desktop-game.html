<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151c19">
  <title>天使の珍品商｜秋の90日経営版</title>
  <link rel="stylesheet" href="style.css">
<style>html[data-whole-canvas-phone]{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<script src="whole-canvas-touch.js?v=1"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="header-ornament" aria-hidden="true"></span><span class="overline">THE ANGEL'S CURIO CABINET</span><h1>天使の珍品商</h1></div>
      <div class="stats" aria-label="経営情報">
        <div><small>営業日</small><strong id="day"></strong></div>
        <div><small>現金</small><strong id="cash"></strong></div>
        <div><small>借金残高</small><strong id="debt"></strong></div>
        <div><small>返済期限</small><strong id="left"></strong></div>
      </div>
    </header>
    <div id="nav-origin"><nav class="tabs" aria-label="店内メニュー">
      <button data-tab="shop" class="active">陳列棚</button>
      <button data-tab="market">闇市場</button>
      <button data-tab="ledger">帳簿と設備</button>
      <button data-tab="codex">珍品図鑑</button>
      <span class="menu-divider" aria-hidden="true"></span>
      <button data-act="open" class="operation primary">本日の店を開く</button>
      <button data-act="next" class="operation">翌日へ進む →</button>
      <button data-act="report" class="operation">営業報告</button>
      <button data-act="replay" class="operation replay">序章を再視聴</button>
      <button data-act="title" class="operation replay">タイトルへ</button>
    </nav></div>
    <main id="view" aria-live="polite"></main>
  <footer>秋の90日間で骨董店を育てる経営シミュレーション｜進行状況はブラウザに自動保存されます</footer>
  </div>
  <div id="modal" class="modal-backdrop hidden" role="presentation"></div>
  <div id="opening" class="opening hidden" role="dialog" aria-modal="true" aria-label="オープニング"></div>
  <div id="title-screen" class="title-screen hidden" role="dialog" aria-modal="true" aria-label="タイトルメニュー"></div>
  <div id="guide-modal" class="guide-backdrop hidden" role="presentation"></div>
  <script src="opening.js"></script>
  <script src="events.js"></script>
  <script src="story-events.js"></script>
  <script src="ledger-screen.js"></script>
  <script src="codex-data.js"></script>
  <script src="ending-scripts.js"></script>
  <script src="demand.js"></script>
  <script src="bgm.js"></script>
  <script src="se.js"></script>
  <script src="guide.js"></script>
  <script src="game.js"></script>
</body>
</html>
